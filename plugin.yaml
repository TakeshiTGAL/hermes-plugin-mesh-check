name: mesh-check
version: "0.1.0"
manifest_version: 2
requires_hermes: ">=0.21.4"
description: "Mesh Check reads one local STL, OBJ, PLY, GLB, or glTF file and returns whether it is closed, its volume, its bounds, and mesh, animation, and material counts. Use it before a 3D print or a game export. Disclosure — opens the path you pass and follows its symlink; stops at 33554432 bytes, including a glTF buffer in that directory; enable prepares trimesh and pygltflib (numpy comes with trimesh); no rendering, repair, network, write, or approval; anyone you allow on your Hermes gateway can call it; install with .git is 260 KiB; remove deletes that directory and can leave numpy, trimesh, known_plugin_toolsets, plugin-deps/pyproject.toml, workspace pyproject.toml, uv.lock, and backups/config."
author: TakeshiTGAL
license: MIT
homepage: https://github.com/TakeshiTGAL/hermes-plugin-mesh-check
platforms:
  - linux
  - macos
provides_tools:
  - mesh_check
provides_hooks: []
python_dependencies:
  # Lower bounds are the versions executed for this tree: trimesh 5.2.0
  # and pygltflib 1.16.5. Scipy, networkx, rtree, shapely, manifold3d, and
  # httpx are optional extras of trimesh and are not listed here.
  - "trimesh>=5.2.0,<6"
  - "pygltflib>=1.16.5,<2"
